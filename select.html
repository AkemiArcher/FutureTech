<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    name="viewport"
  >
  <meta
    content="ie=edge"
    http-equiv="X-UA-Compatible"
  >
  <title>FutureTech | Contacts</title>
  <link
    href="styles/main.css"
    rel="stylesheet"
  >
  <link rel="shortcut icon" href="icons/about-icon.svg" type="image/x-icon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/imask/7.6.1/imask.min.js" defer></script>
  <script defer src="scripts/app.js" type="module"></script>
</head>
<body>
<header class="header" data-js-header>
  <div class="header__promo">
    <div class="header__promo-inner container">
      <a
        class="header__promo-link"
        href="/"
      >
        <span
          class="icon icon--yellow-arrow"
        >Subscribe to our Newsletter For New & latest Blogs and Resources</span>
      </a>
    </div>
  </div>
  <div class="header__body">
    <div class="header__body-inner container">
      <a
        aria-label="Home"
        class="header__logo logo"
        href="index.html"
        title="Home"
      >
        <img
          alt=""
          class="logo__image"
          height="50"
          src="images/logo.svg"
          width="179"
        >
      </a>
      <div
        class="header__overlay"
        data-js-header-overlay
      >
        <nav class="header__menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a
                class="header__menu-link "
                href="./index.html"
              >Home
              </a>
            </li>
            <li class="header__menu-item ">
              <a
                class="header__menu-link"
                href="./news.html"
              >News
              </a>
            </li>
            <li class="header__menu-item">
              <a
                class="header__menu-link"
                href="./podcasts.html"
              >Podcasts
              </a>
            </li>
            <li class="header__menu-item">
              <a
                class="header__menu-link"
                href="./resources.html"
              >Resources
              </a>
            </li>
          </ul>
        </nav>
        <a
          class="header__contact-us-link button button--accent"
          href="./contacts.html"
        >
          Contact Us
        </a>
      </div>
      <button
        aria-label="Open menu"
        class="header__burger-button burger-button visible-mobile"
        data-js-burger-button
        type="button"
      >
        <span class="burger-button__line"></span>
        <span class="burger-button__line"></span>
        <span class="burger-button__line"></span>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div class="select">
    <label class="select__label" for="phoneNumberPrefix">Phone number prefix</label>
    <select class="select__original-control" id="phoneNumberPrefix">
      <option value="">+7</option>
      <option value="">+1</option>
      <option value="">+2</option>
      <option value="">+3</option>
    </select>
  </div>
</div>


</body>
</html>
